<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>友人共有カレンダー</title>
  <style>
    :root{--blue:#2563eb;--blue-dark:#1d4ed8;--bg:#f3f6fb;--surface:#fff;--text:#1f2937;--muted:#64748b;--line:#e2e8f0;--shadow:0 4px 18px rgba(15,23,42,.06)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:0 auto;padding:18px}.hero{background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.hero h1{margin:0;font-size:clamp(1.35rem,3vw,1.8rem)}.hero p{margin:4px 0 0;color:#dbeafe;font-size:.92rem}.header-actions,.month-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-top:16px;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.panel-head h2{margin:0;font-size:1.08rem}.month-label{min-width:145px;text-align:center;font-weight:750;font-size:1.1rem}.btn{border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#334155;padding:8px 12px;font-weight:600}.btn:hover{background:#f8fafc}.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn-primary:hover{background:var(--blue-dark)}.btn-danger{color:#b91c1c;border-color:#fecaca}.btn-small{padding:4px 8px;font-size:.82rem}.note{color:#1e40af;background:#eff6ff;border:1px solid #bfdbfe;padding:10px 14px;border-radius:10px;margin-top:14px;font-size:.88rem}.statusbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 18px;background:#f8fafc;color:var(--muted);font-size:.88rem}.calendar-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:10px;vertical-align:top}th:last-child,td:last-child{border-right:0}th{background:#f8fafc;color:#475569;font-size:.84rem;text-align:left}.date-col{width:76px}.weekday-col{width:52px}.date-cell{font-weight:750;white-space:nowrap}.weekday{font-weight:700}.sun{color:#dc2626}.sat{color:#2563eb}tr.today{background:#eff6ff}tr.today .date-cell::after{content:"今日";display:block;width:fit-content;margin-top:3px;font-size:.68rem;color:#1d4ed8;background:#dbeafe;border-radius:4px;padding:1px 5px}.day-content{min-height:42px}.entry{border-left:4px solid var(--entry-color,#94a3b8);background:var(--entry-bg,#f8fafc);border-radius:6px;padding:6px 8px;margin:0 0 6px;font-size:.88rem;overflow-wrap:anywhere}.entry:last-child{margin-bottom:0}.entry-title{font-weight:700}.entry-meta{font-size:.75rem;color:#64748b;margin-top:2px}.entry-actions{display:flex;gap:5px;margin-top:5px}.empty{color:#94a3b8;font-size:.82rem}.board-list{padding:14px 18px;display:grid;gap:10px}.board-post{border:1px solid var(--line);border-radius:10px;padding:12px}.post-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.author{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:.88rem}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.post-date{color:var(--muted);font-size:.78rem}.post-body{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 0}.form{padding:0 18px 18px;display:grid;gap:9px}.field{display:grid;gap:5px}.field label{font-size:.86rem;font-weight:700;color:#475569}input,textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:9px 10px;background:#fff;color:var(--text)}textarea{min-height:88px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.legend{display:flex;gap:12px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}.legend-item{display:flex;align-items:center;gap:6px;font-size:.82rem;color:#475569}.footer{color:#94a3b8;font-size:.78rem;text-align:center;padding:18px 0 8px}dialog{border:0;border-radius:14px;padding:0;width:min(540px,calc(100% - 24px));box-shadow:0 20px 60px rgba(15,23,42,.25)}dialog::backdrop{background:rgba(15,23,42,.45)}.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-head h3{margin:0}.modal-body{padding:18px;display:grid;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:4px}.mobile-hint{display:none;color:var(--muted);font-size:.78rem;padding:8px 12px 0}.tools{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:720px){.app{padding:10px}.hero{padding:18px;border-radius:12px}.panel-head{padding:12px}.month-label{min-width:125px;font-size:1rem}th,td{padding:7px 6px}.date-col{width:58px}.weekday-col{width:34px}th{font-size:.75rem}.entry{font-size:.82rem;padding:5px 6px}.entry-meta{font-size:.7rem}.grid{grid-template-columns:1fr}}@media(max-width:520px){.calendar-wrap table{min-width:640px}.mobile-hint{display:block}.header-actions .btn{padding:7px 9px;font-size:.85rem}}
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div><h1>友人共有カレンダー</h1><p>友人との予定・連絡事項をひとつに</p></div>
      <div class="header-actions">
        <button class="btn" id="exportBtn" type="button">データを書き出す</button>
        <button class="btn" id="importBtn" type="button">データを読み込む</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
        <button class="btn btn-primary" id="addEventBtn" type="button">＋ 予定を追加</button>
      </div>
    </header>
    <div class="note"><strong>試作版：</strong>このファイルの予定と連絡事項は、現在のブラウザ内に保存されます。友人の端末とは自動共有されません。複数人でリアルタイム共有するには、各自のログイン認証と共有データベースの設定が必要です。JSONの書き出し・読み込みで手動共有できます。</div>

    <section class="panel" aria-labelledby="calendarHeading">
      <div class="panel-head"><h2 id="calendarHeading">月間予定</h2><div class="month-controls"><button class="btn" id="prevMonth" aria-label="前月">‹ 前月</button><div class="month-label" id="monthLabel"></div><button class="btn" id="nextMonth" aria-label="次月">次月 ›</button><button class="btn" id="todayBtn">今月</button></div></div>
      <div class="statusbar"><span id="monthStatus">予定はこのブラウザに保存されます</span><span>予定を選択すると編集・削除できます</span></div>
      <div class="mobile-hint">スマホでは表を左右にスクロールできます。</div>
      <div class="calendar-wrap"><table><thead><tr><th class="date-col">日付</th><th class="weekday-col">曜</th><th>予定</th><th>連絡事項</th></tr></thead><tbody id="calendarBody"></tbody></table></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="panel" aria-labelledby="boardHeading">
      <div class="panel-head"><h2 id="boardHeading">連絡ボード</h2><span class="post-date">伝言・お知らせ</span></div>
      <div class="board-list" id="boardList"></div>
      <form class="form" id="boardForm">
        <div class="grid"><div class="field"><label for="boardName">投稿者名</label><input id="boardName" maxlength="30" required placeholder="例：さくら"></div><div class="field"><label for="boardColor">表示色</label><select id="boardColor"><option value="#2563eb">青</option><option value="#16a34a">緑</option><option value="#dc2626">赤</option><option value="#ca8a04">黄</option><option value="#9333ea">紫</option></select></div></div>
        <div class="field"><label for="boardText">投稿内容</label><textarea id="boardText" maxlength="1500" required placeholder="友人への伝言を入力..."></textarea></div>
        <div><button class="btn btn-primary" type="submit">投稿する</button></div>
      </form>
    </section>
    <div class="footer">友人共有カレンダー — 試作画面</div>
  </main>

  <dialog id="eventDialog"><form id="eventForm">
    <div class="modal-head"><h3 id="eventDialogTitle">予定を追加</h3><button class="btn btn-small" type="button" id="closeEventDialog">閉じる</button></div>
    <div class="modal-body">
      <div class="field"><label for="eventDate">日付</label><input type="date" id="eventDate" required></div>
      <div class="field"><label for="eventType">種類</label><select id="eventType"><option value="event">予定</option><option value="notice">連絡事項</option></select></div>
      <div class="field"><label for="eventTitle">タイトル</label><input id="eventTitle" maxlength="100" required placeholder="例：ランチ、映画、集合場所"></div>
      <div class="field"><label for="eventDetails">詳細（任意）</label><textarea id="eventDetails" maxlength="1500" placeholder="場所や補足など"></textarea></div>
      <div class="grid"><div class="field"><label for="eventTime">時間（任意）</label><input id="eventTime" type="time"></div><div class="field"><label for="eventAuthor">登録者名</label><input id="eventAuthor" maxlength="30" required placeholder="例：さくら"></div></div>
      <div class="field"><label for="eventColor">表示色</label><select id="eventColor"><option value="#2563eb">青</option><option value="#16a34a">緑</option><option value="#dc2626">赤</option><option value="#ca8a04">黄</option><option value="#9333ea">紫</option></select></div>
      <div class="modal-actions"><button class="btn" type="button" id="cancelEvent">キャンセル</button><button class="btn btn-primary" type="submit">保存</button></div>
    </div>
  </form></dialog>

  <script>
    "use strict";
    const EVENTS_KEY = "friendsCalendar_events_v1";
    const POSTS_KEY = "friendsCalendar_posts_v1";
    const $ = id => document.getElementById(id);
    const colors = ["#2563eb", "#16a34a", "#dc2626", "#ca8a04", "#9333ea"];
    let events = readStore(EVENTS_KEY);
    let posts = readStore(POSTS_KEY);
    let viewDate = new Date();
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
    let editingId = null;

    function readStore(key) {
      try { const value = JSON.parse(localStorage.getItem(key) || "[]"); return Array.isArray(value) ? value : []; }
      catch { return []; }
    }
    function save() {
      try {
        localStorage.setItem(EVENTS_KEY, JSON.stringify(events));
        localStorage.setItem(POSTS_KEY, JSON.stringify(posts));
        $("monthStatus").textContent = `予定 ${events.length}件・連絡 ${posts.length}件（このブラウザに保存済み）`;
      } catch (error) { alert("ブラウザに保存できませんでした。空き容量や設定を確認してください。"); }
    }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }
    function dateKey(date) {
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
    }
    function renderCalendar() {
      const year = viewDate.getFullYear(), month = viewDate.getMonth();
      $("monthLabel").textContent = `${year}年${month+1}月`;
      const today = dateKey(new Date()), days = new Date(year, month+1, 0).getDate(), tbody = $("calendarBody");
      tbody.innerHTML = "";
      for (let day=1; day<=days; day++) {
        const date = new Date(year, month, day), key = dateKey(date), dow = date.getDay();
        const row = document.createElement("tr");
        if (key === today) row.classList.add("today");
        const weekdayClass = dow === 0 ? "sun" : dow === 6 ? "sat" : "";
        const daily = events.filter(item => item.date === key);
        row.innerHTML = `<td class="date-cell">${month+1}/${day}</td><td class="weekday ${weekdayClass}">${["日","月","火","水","木","金","土"][dow]}</td><td><div class="day-content">${renderEntries(daily.filter(item=>item.type==="event"))}</div></td><td><div class="day-content">${renderEntries(daily.filter(item=>item.type==="notice"))}</div></td>`;
        tbody.appendChild(row);
      }
      renderLegend();
    }
    function renderEntries(items) {
      if (!items.length) return '<span class="empty">—</span>';
      return items.map(item => `<div class="entry" style="--entry-color:${escapeHtml(item.color)};--entry-bg:${escapeHtml(item.bg)}"><div class="entry-title">${item.time ? `${escapeHtml(item.time)} ` : ""}${escapeHtml(item.title)}</div>${item.details ? `<div>${escapeHtml(item.details).replace(/\n/g,"<br>")}</div>` : ""}<div class="entry-meta">${escapeHtml(item.author || "友人")}</div><div class="entry-actions"><button class="btn btn-small" type="button" data-action="edit" data-id="${escapeHtml(item.id)}">編集</button><button class="btn btn-small btn-danger" type="button" data-action="delete" data-id="${escapeHtml(item.id)}">削除</button></div></div>`).join("");
    }
    function renderLegend() {
      const people = new Map();
      events.forEach(item => { if (item.author) people.set(item.author, item.color || "#64748b"); });
      $("legend").innerHTML = people.size ? [...people].map(([name,color])=>`<span class="legend-item"><span class="dot" style="background:${escapeHtml(color)}"></span>${escapeHtml(name)}</span>`).join("") : '<span class="empty">予定を追加すると登録者が表示されます。</span>';
    }
    function renderBoard() {
      const sorted = [...posts].sort((a,b)=>b.createdAt-a.createdAt);
      $("boardList").innerHTML = sorted.length ? sorted.map(post=>`<article class="board-post"><div class="post-head"><span class="author"><span class="dot" style="background:${escapeHtml(post.color)}"></span>${escapeHtml(post.author)}</span><span class="post-date">${new Date(post.createdAt).toLocaleString("ja-JP")}</span></div><p class="post-body">${escapeHtml(post.text).replace(/\n/g,"<br>")}</p><div class="entry-actions"><button class="btn btn-small btn-danger" type="button" data-post-delete="${escapeHtml(post.id)}">削除</button></div></article>`).join("") : '<div class="empty">まだ投稿はありません。</div>';
    }
    function openEventDialog(item=null, date=dateKey(new Date())) {
      editingId = item?.id ?? null;
      $("eventDialogTitle").textContent = item ? "予定を編集" : "予定を追加";
      $("eventDate").value = item?.date || date;
      $("eventType").value = item?.type || "event";
      $("eventTitle").value = item?.title || "";
      $("eventDetails").value = item?.details || "";
      $("eventTime").value = item?.time || "";
      $("eventAuthor").value = item?.author || $("boardName").value.trim();
      $("eventColor").value = item?.color || $("boardColor").value;
      $("eventDialog").showModal();
    }
    $("calendarBody").addEventListener("click", e => {
      const button = e.target.closest("button[data-action]"); if (!button) return;
      const item = events.find(x=>String(x.id)===button.dataset.id); if (!item) return;
      if (button.dataset.action === "edit") openEventDialog(item);
      if (button.dataset.action === "delete" && confirm("この予定を削除しますか？")) {
        events = events.filter(x=>String(x.id)!==String(item.id)); save(); renderCalendar();
      }
    });
    $("eventForm").addEventListener("submit", e => {
      e.preventDefault();
      const record = {id:editingId || (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`),date:$("eventDate").value,type:$("eventType").value,title:$("eventTitle").value.trim(),details:$("eventDetails").value.trim(),time:$("eventTime").value,author:$("eventAuthor").value.trim(),color:$("eventColor").value,bg:"#eff6ff"};
      if (!record.date || !record.title || !record.author) return;
      const index = events.findIndex(item=>String(item.id)===String(editingId));
      if (index >= 0) events[index] = record; else events.push(record);
      events.sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.time||"").localeCompare(b.time||""));
      $("boardName").value = record.author; $("boardColor").value = record.color;
      save(); renderCalendar(); $("eventDialog").close();
    });
    $("boardForm").addEventListener("submit", e => {
      e.preventDefault();
      const author = $("boardName").value.trim(), text = $("boardText").value.trim(); if (!author || !text) return;
      posts.push({id:crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,author,text,color:$("boardColor").value,createdAt:Date.now()});
      $("boardText").value = ""; save(); renderBoard();
    });
    $("boardList").addEventListener("click", e => {
      const button = e.target.closest("[data-post-delete]"); if (!button) return;
      if (confirm("この投稿を削除しますか？")) { posts=posts.filter(post=>String(post.id)!==button.dataset.postDelete); save(); renderBoard(); }
    });
    $("addEventBtn").addEventListener("click",()=>openEventDialog());
    $("closeEventDialog").addEventListener("click",()=>$("eventDialog").close());
    $("cancelEvent").addEventListener("click",()=>$("eventDialog").close());
    $("prevMonth").addEventListener("click",()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()-1,1);renderCalendar();});
    $("nextMonth").addEventListener("click",()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,1);renderCalendar();});
    $("todayBtn").addEventListener("click",()=>{const now=new Date();viewDate=new Date(now.getFullYear(),now.getMonth(),1);renderCalendar();});
    $("exportBtn").addEventListener("click",()=>{
      const blob=new Blob([JSON.stringify({format:"friends-calendar-v1",events,posts},null,2)],{type:"application/json"});
      const link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download="friends-calendar-data.json";link.click();URL.revokeObjectURL(link.href);
    });
    $("importBtn").addEventListener("click",()=>$("importFile").click());
    $("importFile").addEventListener("change",async e=>{
      const file=e.target.files?.[0];if(!file)return;
      try{const data=JSON.parse(await file.text());if(data.format!=="friends-calendar-v1"||!Array.isArray(data.events)||!Array.isArray(data.posts))throw new Error("形式が違います");
        if(!confirm("現在の予定・投稿を、読み込むデータで置き換えます。続けますか？"))return;
        events=data.events;posts=data.posts;save();renderCalendar();renderBoard();alert("データを読み込みました。");
      }catch(error){alert("読み込みに失敗しました。友人共有カレンダーから書き出したJSONを選んでください。\n"+error.message);}
      finally{e.target.value="";}
    });
    renderCalendar();renderBoard();save();
  </script>
</body>
</html>
